<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barèmes EPS — Collège</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --teal:#0e7c7b;--teal-d:#085e5d;--teal-l:#E1F5EE;
  --amber:#f0a500;--c3:#2563eb;--c3-l:#dbeafe;
  --ca1:#e85d04;--ca2:#2d6a4f;--ca3:#7209b7;--ca4:#0e7c7b;
  --bg:#f4f6f5;--white:#fff;--gray:#e8eceb;--text:#1a2524;--muted:#6b7f7e;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* TOPBAR */
.topbar{background:var(--teal-d);color:#fff;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.22);gap:10px}
.topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:1px;white-space:nowrap}
.sport-nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1}
.sport-nav::-webkit-scrollbar{display:none}
.snb{font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:600;padding:4px 9px;border-radius:5px;border:none;cursor:pointer;background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);white-space:nowrap;transition:all .15s}
.snb:hover,.snb.active{background:#fff;color:var(--teal-d)}

/* CYCLE SWITCHER */
.cycle-bar{background:var(--white);border-bottom:1px solid var(--gray);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:52px;z-index:190}
.cycle-label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.cycle-btns{display:flex;gap:6px}
.cyc-btn{padding:6px 16px;border-radius:8px;border:2px solid var(--gray);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--muted)}
.cyc-btn.c3.active{background:var(--c3);border-color:var(--c3);color:#fff}
.cyc-btn.c4.active{background:var(--teal);border-color:var(--teal);color:#fff}
.cycle-badge{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:20px;color:#fff;margin-left:4px}
.badge-c3{background:var(--c3)}
.badge-c4{background:var(--teal)}

/* CONTAINER */
.container{max-width:540px;margin:0 auto;padding:20px 16px 60px}
@media(min-width:900px){
  .container.wide{max-width:1100px}
  .container.wide .cycle-block.active{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:20px;align-items:start}
  .container.wide .cycle-block.active>div[id$='-criteres']{position:sticky;top:118px;max-height:calc(100vh - 130px);overflow-y:auto}
}

/* PANELS */
.sport-panel{display:none}
.sport-panel.active{display:block}
.cycle-block{display:none}
.cycle-block.active{display:block}

/* SPORT HEADER */
.sport-header{margin-bottom:18px}
.sport-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--teal);letter-spacing:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sport-sub{font-size:.85rem;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ca-pill{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff;display:inline-block}
.cycle-tag{font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--gray);margin-bottom:18px}
.tab{padding:9px 18px;font-size:.88rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab.active{color:var(--teal);border-bottom-color:var(--teal)}

/* CARD */
.card{background:var(--white);border-radius:14px;padding:22px 18px;width:100%;box-shadow:0 2px 12px rgba(14,124,123,.08);margin-bottom:12px}
.field-lbl{display:block;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.prenom-input{width:100%;font-family:'DM Sans',sans-serif;font-size:1.1rem;font-weight:600;padding:10px 13px;border:2px solid var(--gray);border-radius:10px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;margin-bottom:20px}
.prenom-input:focus{border-color:var(--teal);background:var(--white)}

/* CRITERES */
.critere{margin-bottom:18px}
.critere-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.critere-title{font-weight:600;font-size:.92rem}
.critere-max{font-size:.76rem;color:var(--muted);font-weight:500}
.critere-hint{font-size:.76rem;color:var(--muted);margin-bottom:8px;line-height:1.4;font-style:italic}
.sous-critere{margin-bottom:12px;padding-left:10px;border-left:2px solid var(--gray)}
.sous-critere-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sous-critere-title{font-size:.78rem;font-weight:600;color:var(--muted)}
.sous-critere-max{font-size:.73rem;color:var(--muted)}
.pts-row{display:flex;flex-wrap:wrap;gap:6px}
.pts-btn{width:36px;height:36px;border-radius:8px;border:2px solid var(--gray);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s}
.pts-btn:hover{border-color:var(--teal);color:var(--teal)}
.pts-na{width:auto;padding:0 9px;font-size:.72rem;margin-left:6px;border-style:dashed}
.pts-btn.sel{background:var(--teal);border-color:var(--teal);color:#fff;transform:scale(1.08)}

/* TOTAL */
.divider{height:1px;background:var(--gray);margin:16px 0}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.total-lbl{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:1px}
.total-val{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--teal);line-height:1}
.total-val span{font-size:1rem;color:var(--muted)}
.btn-valider{width:100%;padding:13px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:1.5px;cursor:pointer;transition:background .2s,transform .1s}
.btn-valider:hover{background:var(--teal-d)}
.btn-valider:active{transform:scale(.98)}
.btn-statut{flex:1;padding:9px;background:#fff;color:var(--muted);border:1.5px solid var(--gray);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer}
.btn-statut:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.btn-statut:disabled{opacity:.45;cursor:not-allowed}
.btn-valider:disabled{background:var(--gray);color:var(--muted);cursor:not-allowed}

/* LISTE */
.liste-title{font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 7px}
.eleve-item{background:var(--white);border-radius:10px;padding:10px 13px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 5px rgba(14,124,123,.06);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.eleve-prenom{font-weight:600;font-size:.92rem}
.eleve-detail{font-size:.7rem;color:var(--muted);margin-top:2px}
.eleve-note{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--teal);line-height:1;margin-left:8px;flex-shrink:0}
.eleve-note span{font-size:.75rem;color:var(--muted)}
.btn-ic{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.78rem;padding:3px 6px;border-radius:5px;transition:background .15s,color .15s;margin-left:3px}
.btn-ic:hover{background:var(--gray)}
.btn-del:hover{color:#e05555}
.btn-edit:hover{color:var(--teal)}
.btn-export{width:100%;max-width:540px;padding:11px;background:var(--amber);color:#fff;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1.5px;cursor:pointer;transition:opacity .2s;margin-top:4px;display:none}
.btn-export:hover{opacity:.88}

/* CRITERES TAB */
.detail-card{background:var(--white);border-radius:12px;padding:16px 14px;margin-bottom:10px;box-shadow:0 1px 7px rgba(14,124,123,.07)}
.detail-title{font-weight:600;font-size:.92rem;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dbadge{background:var(--teal-l);color:var(--teal-d);font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:20px}
.detail-hint{font-size:.73rem;color:var(--muted);margin-bottom:9px;line-height:1.4;font-style:italic}
.sub-label{font-size:.73rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}
table{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:5px}
th{text-align:left;color:var(--muted);font-weight:600;padding:0 0 4px;border-bottom:1px solid var(--gray)}
th:last-child{text-align:right}
td{padding:5px 0;border-bottom:1px solid var(--gray);color:var(--text);line-height:1.35;vertical-align:top}
td:last-child{text-align:right;font-weight:600;color:var(--teal);white-space:nowrap;padding-left:8px}
tr:last-child td{border-bottom:none}
.ca-box{background:var(--bg);border-radius:9px;padding:11px 13px;font-size:.75rem;color:var(--muted);line-height:1.5;margin-top:4px}
.ca-box strong{color:var(--text)}

/* HOME */
.home-header{text-align:center;margin-bottom:22px;padding-top:8px}
.home-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:var(--teal);letter-spacing:2px;line-height:1}
.home-sub{font-size:.88rem;color:var(--muted);margin-top:4px}
.fam-section{margin-bottom:16px}
.fam-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:7px;padding-bottom:3px;border-bottom:1px solid var(--gray)}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:400px){.home-grid{grid-template-columns:repeat(2,1fr)}}
.home-card{background:var(--white);border-radius:11px;padding:13px 10px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 1px 7px rgba(14,124,123,.07);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px solid transparent}
.home-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(14,124,123,.13)}
.home-card.has-data{border-color:var(--teal-l)}
.home-emoji{font-size:1.5rem}
.home-nom{font-weight:700;font-size:.75rem;color:var(--text);line-height:1.2}
.home-fam{font-size:.62rem;color:var(--muted)}
.home-count{font-size:.6rem;font-weight:600;color:var(--teal)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px 18px;width:92%;max-width:400px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;color:var(--teal);margin-bottom:14px;letter-spacing:1px}
.modal-critere{margin-bottom:13px}
.modal-critere p{font-size:.76rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.modal-btns{display:flex;gap:7px;margin-top:18px}
.btn-save{flex:1;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:9px;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;cursor:pointer}
.btn-save:hover{background:var(--teal-d)}
.btn-cancel{padding:11px 16px;background:var(--gray);color:var(--muted);border:none;border-radius:9px;font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;cursor:pointer}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--teal-d);color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;font-size:.88rem;transition:transform .32s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:400}
.toast.show{transform:translateX(-50%) translateY(0)}
  .terrains{margin:4px 0 8px;font-size:.78rem}
  .terr-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .terr-lbl{color:var(--muted);font-weight:600}
  .terr-row button{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--gray);background:var(--bg);font-weight:700;cursor:pointer}
  .terr-n{min-width:22px;text-align:center}
  .terr-map{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
  .terr-map b{color:var(--teal)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">🏃 EPS</div>
  <nav class="sport-nav" id="sportNav"></nav>
</div>

<div class="cycle-bar">
  <span class="cycle-label">Cycle</span>
  <div class="cycle-btns">
    <button class="cyc-btn c3 active" id="btn-6e" onclick="setClasse('6e')">6e</button>
    <button class="cyc-btn c4" id="btn-5e" onclick="setClasse('5e')">5e</button>
    <button class="cyc-btn c4" id="btn-4e" onclick="setClasse('4e')">4e</button>
    <button class="cyc-btn c4" id="btn-3e" onclick="setClasse('3e')">3e</button>
  </div>
</div>

<div class="container">
  <div class="sport-panel active" id="panel-home">
    <div class="home-header">
      <div class="home-title">Barèmes EPS</div>
      <div class="home-sub" id="home-sub">15 APSA · Cycle 3 — 6e</div>
    </div>
    <div id="homeContent"></div>
  </div>
  <div id="sportPanels"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-titre">Modifier</h3>
    <div id="modal-criteres"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveEdit()">✓ Enregistrer</button>
    </div>
  </div>
</div>

<div id="papier-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:14px;padding:18px;width:100%;max-width:380px;font-family:'DM Sans',sans-serif">
    <h3 id="papier-titre" style="margin:0 0 10px;font-size:1rem">📄 Fiche papier</h3>
    <label style="font-size:.8rem;color:#666">Classe</label>
    <select id="papier-classe" onchange="papierInfo()" style="width:100%;padding:10px;font-size:1rem;border:1px solid #ccc;border-radius:8px;margin:4px 0 8px"></select>
    <div id="papier-seances-row" style="display:none">
      <label style="font-size:.8rem;color:#666">Nombre de séances du cycle</label>
      <input type="number" id="papier-seances" min="3" max="20" value="10" style="width:100%;padding:10px;font-size:1rem;border:1px solid #ccc;border-radius:8px;margin:4px 0 8px;box-sizing:border-box">
    </div>
    <p id="papier-info" style="margin:0 0 10px;font-size:.8rem;color:#666"></p>
    <div style="display:flex;gap:8px">
      <button onclick="document.getElementById('papier-modal').style.display='none'" style="flex:1;padding:10px;border:1px solid #ccc;background:#fff;border-radius:9px;cursor:pointer">Annuler</button>
      <button onclick="papierImprimer()" style="flex:2;padding:10px;border:none;background:#0e7c7b;color:#fff;border-radius:9px;font-weight:700;cursor:pointer">🖨 Imprimer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="baremes-data.js"></script>
<script>
// ═══════════════════════════════════════════════════════
// DONNÉES — 15 SPORTS × 2 CYCLES
// ═══════════════════════════════════════════════════════
// Données des barèmes : fichier partagé baremes-data.js (aussi lu par les fiches APSA de l'app).



// ═══════════════════════════════════════════════════════
// STATE & HELPERS
// ═══════════════════════════════════════════════════════
let currentCycle = 'c3';
let currentClasse = '6e';
const elevesCl = {'5e':{},'4e':{},'3e':{}};
// ── Sauvegarde des notes (localStorage 'notes-<année>', synchronisée avec le cloud par l'app) ──
function notesKey(){ var y=anneeCourante(); return y ? 'notes-'+y : null; }
function saveNotes(){
  try{
    var k=notesKey(); if(!k) return;
    var out={};
    SPORTS.forEach(function(sp){
      var o={};
      if(state[sp.id].c3.eleves.length) o['6e']=state[sp.id].c3.eleves;
      ['5e','4e','3e'].forEach(function(cl){
        var arr = (currentClasse===cl) ? state[sp.id].c4.eleves : elevesCl[cl][sp.id];
        if(arr && arr.length) o[cl]=arr;
      });
      if(Object.keys(o).length) out[sp.id]=o;
    });
    localStorage.setItem(k, JSON.stringify(out));
    if(window.parent && window.parent!==window && typeof window.parent.scheduleCloudSync==='function') window.parent.scheduleCloudSync();
  }catch(e){}
}
function loadNotes(){
  try{
    var k=notesKey(); if(!k) return;
    var d=JSON.parse(localStorage.getItem(k)||'{}');
    SPORTS.forEach(function(sp){
      var o=d[sp.id]||{};
      state[sp.id].c3.eleves = o['6e']||[];
      ['5e','4e','3e'].forEach(function(cl){ elevesCl[cl][sp.id]=o[cl]||[]; });
    });
  }catch(e){}
}
// Ouvre le barème d'un sport pour une classe (appelé depuis l'app ou via #sport=…&cl=…)
function ouvrirBareme(sid, cl){
  if(!SPORTS.some(function(x){return x.id===sid;})) return;
  if(['6e','5e','4e','3e'].indexOf(cl)<0) cl=currentClasse;
  setClasse(cl);
  showPanel(sid);
}
window.addEventListener('message', function(e){
  if(e.origin!==location.origin) return;
  var d=e.data; if(d && d.type==='openBareme') ouvrirBareme(d.sid, d.cl);
});
function setClasse(cl){
  if(currentCycle==='c4') SPORTS.forEach(function(sp){ elevesCl[currentClasse][sp.id]=state[sp.id].c4.eleves; });
  currentClasse = cl;
  if(cl!=='6e') SPORTS.forEach(function(sp){ state[sp.id].c4.eleves = elevesCl[cl][sp.id] || (elevesCl[cl][sp.id]=[]); renderListe(sp.id,'c4'); });
  else SPORTS.forEach(function(sp){ renderListe(sp.id,'c3'); });
  setCycle(cl==='6e'?'c3':'c4');
  majNiveau();
  coUpdateBareme('c4');
  majNav();
  remplirNoms();
}
const state = {};
SPORTS.forEach(s => { state[s.id] = { c3:{ eleves:[], scores:{} }, c4:{ eleves:[], scores:{} } }; });
let editIdx = null, editSportId = null, editCycle = null;
const modalState = {};

// Barème effectif (exigences de la classe) : 6e → cycle 3, sinon la classe choisie (5e par défaut).
function classeCycle(cyc){ return cyc==='c3' ? '6e' : (currentClasse==='6e' ? '5e' : currentClasse); }
function eff(s, cyc){ return baremeNiveau(s, classeCycle(cyc)) || s[cyc]; }
function getCriteres(sid) { return SPORTS.find(s=>s.id===sid)[currentCycle].criteres; }
function getSc(sid) { return state[sid][currentCycle].scores; }
function getEleves(sid) { return state[sid][currentCycle].eleves; }

function allKeys(criteres) {
  const keys = [];
  criteres.forEach(c => {
    if(c.sous) c.sous.forEach(sc => keys.push({ key: c.id+'_'+sc.id, max: sc.max, label: sc.label }));
    else keys.push({ key: c.id, max: c.max, label: c.label });
  });
  return keys;
}

// Valeur 'na' = critère non évalué (ex. élève blessé qui n'a pas fait un passage) : il est retiré du calcul
// et le total est ramené proportionnellement à ce qui a été évalué (arrondi au demi-point).
function nombre(v){ return typeof v==='number'?v:0; }
function fmtSc(v){ return v==='na'?'NE':(v!==null&&v!==undefined?v:'—'); }
function computeTotal(criteres, scores) {
  let t=0, mxEval=0, mxAll=0;
  criteres.forEach(c => {
    mxAll+=c.max;
    let got=0, mx=0, full=c.max;
    if(c.sous){
      full=c.sous.reduce((a,x)=>a+x.max,0);
      c.sous.forEach(sc=>{ const v=scores[c.id+'_'+sc.id]; if(v==='na') return; mx+=sc.max; got+=nombre(v); });
    } else { const v=scores[c.id]; if(v!=='na'){ mx=c.max; got=nombre(v); } }
    if(mx===0) return;
    mxEval+=c.max;
    t+= (c.sous && mx<full) ? got/mx*full : got;
  });
  if(mxEval===0) return 0;
  if(mxEval<mxAll) t=t/mxEval*mxAll;
  return Math.round(t*2)/2;
}

function maxTotal(criteres) { return criteres.reduce((s,c)=>s+c.max,0); }
function caColor(ca) { return {CA1:'#e85d04',CA2:'#2d6a4f',CA3:'#7209b7',CA4:'#0e7c7b'}[ca]||'#888'; }

function setCycle(c) {
  currentCycle = c;
  ['6e','5e','4e','3e'].forEach(function(k){ document.getElementById('btn-'+k).classList.toggle('active', k===currentClasse); });
  document.getElementById('home-sub').textContent =
    SPORTS.filter(sportVisible).length+' APSA · ' + (c==='c3' ? 'Cycle 3' : 'Cycle 4') + ' — ' + currentClasse;
  document.querySelectorAll('.cycle-block').forEach(function(el) {
    el.classList.toggle('active', el.dataset.cycle === c);
  });
  // Mettre à jour le sous-titre du sport actif
  var ap = document.querySelector('.sport-panel.active');
  if(ap && ap.id !== 'panel-home') {
    var sid = ap.id.replace('panel-','');
    var sp = SPORTS.find(function(s){ return s.id===sid; });
    if(sp) {
      var sub = document.getElementById(sid+'-sub');
      if(sub) sub.textContent = eff(sp,c).seances + ' séances · ' + currentClasse;
    }
  }
  buildHome();
}

// Détail des critères d'un barème effectif (onglet « Critères » et rappel imprimé).
function detailCriteres(cd){
  let h=`<div class="ca-box niveau-box"><strong>Barème ${cd.classe}</strong>${cd.classe==='6e'?' · cycle 3':' · cycle 4'}<br>`
    +`<strong>Compétence attendue :</strong> ${cd.ca_texte}`
    +(cd.epreuve?`<br><strong>Épreuve :</strong> ${cd.epreuve}`:'')+`</div>`;
  cd.criteres.forEach(c => {
    let tbl='';
    if(c.table&&c.table.length){
      tbl='<table><tr><th>Observation</th><th>Pts</th></tr>';
      c.table.forEach(r=>{ tbl+=`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`; });
      tbl+='</table>';
    }
    let sous='';
    if(c.sous){ c.sous.forEach(sc=>{ sous+=`<p class="sub-label">${sc.label} — /${sc.max} pts</p>`; }); sous+=tbl; }
    h+=`<div class="detail-card">
      <div class="detail-title">${c.label} <span class="dbadge">/ ${c.max} pts</span></div>
      <p class="detail-hint">${c.hint||''}</p>
      ${c.sous?sous:tbl}
    </div>`;
  });
  h+=`<p class="detail-hint" style="margin-top:6px">Dans les tableaux, « 106–114 s » veut dire de 106 s (inclus) à 114 s (exclu).</p>`;
  return h;
}
// Met à jour les textes et tableaux du cycle 4 selon la classe choisie (5e, 4e ou 3e).
function majNiveau(){
  SPORTS.forEach(function(s){
    ['c3','c4'].forEach(function(cyc){

      var cr=document.getElementById(s.id+'-'+cyc+'-criteres'); if(cr) cr.innerHTML=detailCriteres(cd);
    });
  });
  majTerrains();

// Tournois montante-descendante : barème calculé selon le nombre de terrains (ou tables) du jour.
function nbTerrains(sid){ try{ return Math.max(1,Math.min(20,parseInt(localStorage.getItem('terrains-'+sid),10)||4)); }catch(e){ return 4; } }
function ptsTerrain(rang, n, max, min){ if(n<=1) return max; return Math.round(max-(max-min)*(rang-1)/(n-1)); }
function majTerrains(){
  document.querySelectorAll('.terrains').forEach(function(el){
    var s=SPORTS.find(function(x){return x.id===el.dataset.sid;}); if(!s) return;
    var c=eff(s,el.dataset.cyc).criteres.find(function(x){return x.id===el.dataset.cid;}); if(!c||!c.terrains) return;
    var n=nbTerrains(s.id), mot=c.terrains.mot||'Terrain', l=[];
    for(var r=1;r<=n;r++) l.push('<span>'+mot+' '+r+(r===1?' (haut)':r===n&&n>1?' (bas)':'')+' : <b>'+ptsTerrain(r,n,c.max,c.terrains.min||0)+'</b></span>');
    el.innerHTML='<div class="terr-row"><span class="terr-lbl">'+mot+'s aujourd\'hui</span>'
      +'<button type="button" onclick="adjTerrains(\''+s.id+'\',-1)" aria-label="Moins">−</button><b class="terr-n">'+n+'</b>'
      +'<button type="button" onclick="adjTerrains(\''+s.id+'\',1)" aria-label="Plus">+</button></div><div class="terr-map">'+l.join('')+'</div>';
  });
}
function adjTerrains(sid,d){ try{ localStorage.setItem('terrains-'+sid, String(Math.max(1,Math.min(20,nbTerrains(sid)+d)))); }catch(e){} majTerrains(); }

// ═══════════════════════════════════════════════════════
// INIT BUTTONS
// ═══════════════════════════════════════════════════════
function initBtns(s, cyc) {
  const sc = state[s.id][cyc].scores;
  s[cyc].criteres.forEach(c => {
    if(c.sous) {
      c.sous.forEach(sub => {
        const key = c.id+'_'+sub.id;
        sc[key]=null;
        mkBtns(`${s.id}-${cyc}-btn-${key}`, sub.max, key, sc, ()=>updateTotal(s,cyc));
      });
    } else {
      sc[c.id]=null;
      mkBtns(`${s.id}-${cyc}-btn-${c.id}`, c.max, c.id, sc, ()=>updateTotal(s,cyc));
    }
  });
}

function mkBtns(cid, max, key, scObj, cb) {
  const c=document.getElementById(cid); if(!c) return;
  for(let i=0;i<=max;i++){
    const b=document.createElement('button');
    b.className='pts-btn'; b.textContent=i;
    b.onclick=()=>{
      c.querySelectorAll('.pts-btn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); scObj[key]=i; if(cb)cb();
    };
    c.appendChild(b);
  }
  const na=document.createElement('button');
  na.className='pts-btn pts-na'; na.textContent='NE'; na.title='Non évalué (retiré du calcul)';
  na.onclick=()=>{
    c.querySelectorAll('.pts-btn').forEach(x=>x.classList.remove('sel'));
    na.classList.add('sel'); scObj[key]='na'; if(cb)cb();
  };
  c.appendChild(na);
}

// ═══════════════════════════════════════════════════════
// TOTAL & READY
// ═══════════════════════════════════════════════════════
function updateTotal(sport, cyc) {
  const sc=state[sport.id][cyc].scores;
  sport[cyc].criteres.forEach(c => {
    if(c.sous){
      let sub=0; c.sous.forEach(s=>{sub+=nombre(sc[c.id+'_'+s.id]);});
      const el=document.getElementById(`${sport.id}-${cyc}-run-${c.id}`);
      if(el) el.textContent=sub;
    }
  });
  const all=sport[cyc].criteres.every(c=>{
    if(c.sous) return c.sous.every(s=>sc[c.id+'_'+s.id]!==null);
    return sc[c.id]!==null;
  });
  if(all){
    const t=computeTotal(sport[cyc].criteres,sc);
    const mxT=maxTotal(sport[cyc].criteres);
    document.getElementById(`${sport.id}-${cyc}-total`).innerHTML=t+`<span> / ${mxT}</span>`;
  }
  checkReady(sport.id, cyc);
}

function checkReady(sid, cyc) {
  const sport=SPORTS.find(s=>s.id===sid);
  const sc=state[sid][cyc].scores;
  const prenomOk=(document.getElementById(`${sid}-${cyc}-prenom`)?.value.trim().length>0);
  const allFilled=sport[cyc].criteres.every(c=>{
    if(c.sous) return c.sous.every(s=>sc[c.id+'_'+s.id]!==null);
    return sc[c.id]!==null;
  });
  const btn=document.getElementById(`${sid}-${cyc}-valider`);
  if(btn) btn.disabled=!(prenomOk&&allFilled);
  ['abs','nn'].forEach(function(k){ var b=document.getElementById(sid+'-'+cyc+'-'+k); if(b) b.disabled=!prenomOk; });
}
var STATUT_LBL={abs:'ABS',nn:'NN'};
function marquerStatut(sid, cyc, statut){
  var sport=SPORTS.find(function(x){return x.id===sid;});
  var prenom=document.getElementById(sid+'-'+cyc+'-prenom').value.trim();
  if(!prenom) return;
  state[sid][cyc].eleves.push({prenom:prenom, scores:{}, total:null, max:maxTotal(sport[cyc].criteres), statut:statut});
  renderListe(sid, cyc);
  saveNotes();
  showToast(prenom+(statut==='abs'?' marqué(e) absent(e)':' marqué(e) non noté(e)'));
  resetSport(sid, cyc);
  refreshHomeCard(sid);
}

// ═══════════════════════════════════════════════════════
// VALIDER
// ═══════════════════════════════════════════════════════
function valider(sid, cyc) {
  const sport=SPORTS.find(s=>s.id===sid);
  const prenom=document.getElementById(`${sid}-${cyc}-prenom`).value.trim();
  const sc=state[sid][cyc].scores;
  const scoresCopy={...sc};
  const total=computeTotal(sport[cyc].criteres, scoresCopy);
  const mxT=maxTotal(sport[cyc].criteres);
  state[sid][cyc].eleves.push({prenom, scores:scoresCopy, total, max:mxT});
  renderListe(sid, cyc);
  saveNotes();
  showToast(prenom+' enregistré ✓');
  resetSport(sid, cyc);
  refreshHomeCard(sid);
}

// LISTE
// ═══════════════════════════════════════════════════════
function renderListe(sid, cyc) {
  const sport=SPORTS.find(s=>s.id===sid);
  const eleves=state[sid][cyc].eleves;
  const liste=document.getElementById(`${sid}-${cyc}-liste`);
  const section=document.getElementById(`${sid}-${cyc}-liste-section`);
  const nb=document.getElementById(`${sid}-${cyc}-nb`);
  const exp=document.getElementById(`${sid}-${cyc}-export`);
  liste.innerHTML='';
  nb.textContent=eleves.length;
  section.style.display=eleves.length>0?'block':'none';
  exp.style.display=eleves.length>0?'block':'none';
  const keys=allKeys(sport[cyc].criteres);
  eleves.forEach((e,i)=>{
    const detail=keys.slice(0,4).map(k=>{
      const lbl=k.label.replace(/^[^\wÀ-ÿ]*/,'').split(' ').slice(0,2).join(' ');
      return lbl+' '+fmtSc(e.scores[k.key])+'/'+k.max;
    }).join(' · ');
    const item=document.createElement('div');
    item.className='eleve-item';
    const stLbl=e.statut?STATUT_LBL[e.statut]:null;
    item.innerHTML=`
      <div style="flex:1;min-width:0">
        <div class="eleve-prenom">${e.prenom}</div>
        <div class="eleve-detail">${stLbl?(e.statut==='abs'?'Absent(e)':'Non noté(e)'):detail}</div>
      </div>
      <div style="display:flex;align-items:center">
        <button class="btn-ic btn-edit" onclick="openModal('${sid}','${cyc}',${i})">✏️</button>
        <button class="btn-ic btn-del" onclick="supprimerEleve('${sid}','${cyc}',${i})">🗑</button>
        <div class="eleve-note" style="margin-left:6px">${stLbl?stLbl:e.total+'<span>/'+e.max+'</span>'}</div>
      </div>`;
    liste.appendChild(item);
  });
}

// ═══════════════════════════════════════════════════════
// SUPPRIMER

function supprimerEleve(sid, cyc, idx) {
  const prenom=state[sid][cyc].eleves[idx].prenom;
  state[sid][cyc].eleves.splice(idx,1);
  renderListe(sid,cyc);
  saveNotes();
  refreshHomeCard(sid);
  showToast(prenom+' supprimé');
}

function resetSport(sid, cyc) {
  const sport=SPORTS.find(s=>s.id===sid);
  const sc=state[sid][cyc].scores;
  Object.keys(sc).forEach(k=>sc[k]=null);
  const block=document.getElementById(`${sid}-${cyc}-block`);
  block.querySelectorAll('.pts-btn').forEach(b=>b.classList.remove('sel'));
  const mxT=maxTotal(sport[cyc].criteres);
  document.getElementById(`${sid}-${cyc}-total`).innerHTML=`—<span> / ${mxT}</span>`;
  sport[cyc].criteres.forEach(c=>{
    if(c.sous){ const el=document.getElementById(`${sid}-${cyc}-run-${c.id}`); if(el) el.textContent='0'; }
  });
  const inp=document.getElementById(`${sid}-${cyc}-prenom`);
  if(inp){inp.value='';inp.focus();}
  document.getElementById(`${sid}-${cyc}-valider`).disabled=true;
  ['abs','nn'].forEach(function(k){ var b=document.getElementById(sid+'-'+cyc+'-'+k); if(b) b.disabled=true; });
}

function openModal(sid, cyc, idx) {
  const sport=SPORTS.find(s=>s.id===sid);
  const e=state[sid][cyc].eleves[idx];
  editIdx=idx; editSportId=sid; editCycle=cyc;
  Object.keys(modalState).forEach(function(k){ delete modalState[k]; });
  Object.assign(modalState, e.scores);
  document.getElementById('modal-titre').textContent='Modifier — '+e.prenom;
  const mc=document.getElementById('modal-criteres'); mc.innerHTML='';
  allKeys(sport[cyc].criteres).forEach(k=>{
    const div=document.createElement('div'); div.className='modal-critere';
    div.innerHTML=`<p>${k.label} — /${k.max}</p><div class="pts-row" id="mbtn-${k.key}"></div>`;
    mc.appendChild(div);
    const cont=document.getElementById('mbtn-'+k.key);
    for(let i=0;i<=k.max;i++){
      const b=document.createElement('button');
      b.className='pts-btn'+(e.scores[k.key]===i?' sel':''); b.textContent=i;
      b.onclick=()=>{ cont.querySelectorAll('.pts-btn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); modalState[k.key]=i; };
      cont.appendChild(b);
    }
    const na=document.createElement('button');
    na.className='pts-btn pts-na'+(e.scores[k.key]==='na'?' sel':''); na.textContent='NE'; na.title='Non évalué (retiré du calcul)';
    na.onclick=()=>{ cont.querySelectorAll('.pts-btn').forEach(x=>x.classList.remove('sel')); na.classList.add('sel'); modalState[k.key]='na'; };
    cont.appendChild(na);
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  editIdx=null; editSportId=null; editCycle=null;
}

function saveEdit(){
  if(editIdx===null) return;
  const sport=SPORTS.find(s=>s.id===editSportId);
  const e=state[editSportId][editCycle].eleves[editIdx];
  Object.assign(e.scores, modalState);
  e.total=computeTotal(sport[editCycle].criteres, e.scores);
  delete e.statut;
  renderListe(editSportId, editCycle);
  saveNotes();
  showToast(e.prenom+' mis à jour');
  closeModal();
}

function showPanel(id) {
  document.querySelectorAll('.sport-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.snb').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  const nb = id==='home'
    ? document.querySelector('.snb')
    : document.getElementById('nav-'+id);
  if(nb) nb.classList.add('active');
  if(id==='home') buildHome();
  else {
    // Update sub and tabs state
    const sport=SPORTS.find(s=>s.id===id);
    const cd=eff(sport,currentCycle);
    const sub=document.getElementById(id+'-sub');
    if(sub) sub.textContent=`${cd.seances} séances · ${currentClasse}`;
    // Reset tabs to saisie
    document.querySelectorAll(`#panel-${id} .tab`).forEach((t,i)=>t.classList.toggle('active',i===0));
    ['c3','c4'].forEach(cyc=>{
      const s=document.getElementById(`${id}-${cyc}-saisie`);
      const cr=document.getElementById(`${id}-${cyc}-criteres`);
      if(s) s.style.display='block';
      if(cr) cr.style.display='none';
    });
    document.querySelector('.container').classList.remove('wide');
  }
  window.scrollTo(0,0);
}

function switchTab(sid, name, btn) {
  ['c3','c4'].forEach(cyc=>{
    const s=document.getElementById(`${sid}-${cyc}-saisie`);
    const cr=document.getElementById(`${sid}-${cyc}-criteres`);
    const split=name==='criteres'&&window.matchMedia('(min-width:900px)').matches;
    if(s) s.style.display=(name==='saisie'||split)?'block':'none';
    if(cr) cr.style.display=name==='criteres'?'block':'none';
  });
  document.querySelector('.container').classList.toggle('wide', name==='criteres'&&window.matchMedia('(min-width:900px)').matches);
  document.querySelectorAll(`#${sid}-tabs .tab`).forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

function refreshHomeCard(sid) {
  const card=document.getElementById('hcard-'+sid);
  if(!card) return;
  const nb=state[sid][currentCycle].eleves.length;
  card.classList.toggle('has-data',nb>0);
  let countEl=card.querySelector('.home-count');
  if(nb>0){
    if(!countEl){ countEl=document.createElement('div'); countEl.className='home-count'; card.appendChild(countEl); }
    countEl.textContent=nb+' élève'+(nb>1?'s':'');
  } else if(countEl) countEl.remove();
}

function imprimer(sid, cyc) {

  const keys=allKeys(sport[cyc].criteres);
  const cycLabel=(cyc==='c3'?'Cycle 3':'Cycle 4')+' — '+currentClasse;

  <style>body{font-family:sans-serif;padding:20px}h2{color:#0e7c7b;margin-bottom:14px;font-size:16px}
  table{width:100%;border-collapse:collapse}th{background:#0e7c7b;color:white;padding:7px 9px;text-align:left;font-size:11px}
  td{padding:6px 9px;border-bottom:1px solid #e0e0e0;font-size:11px}tr:nth-child(even) td{background:#f4f6f5}
  .t{font-weight:700;color:#0e7c7b}</style></head><body>
  <h2>${sport.emoji} ${sport.nom} — ${cycLabel} · ${sport[cyc].seances} séances</h2>
  <table><tr><th>Prénom</th>`;
  keys.forEach(k=>{
    const lbl=k.label.replace(/^[^\wÀ-ÿ]*/,'').split(' ').slice(0,2).join(' ');
    html+=`<th>${lbl} /${k.max}</th>`;
  });

function fichePapier(sid, cyc, cl) {
  const sport=SPORTS.find(s=>s.id===sid);
  const crits=eff(sport,cyc).criteres;
  const cycLabel=(cyc==='c3'?'Cycle 3':'Cycle 4')+' — '+currentClasse;
  const clean=l=>l.replace(/^[^\wÀ-ÿ]*/,'');
  const nums=max=>{let h='';for(let i=0;i<=max;i++)h+='<span class="n">'+i+'</span>';return h;};
  // Colonnes : un bloc par critère, une sous-colonne par sous-critère
  let head1='<th rowspan="2" class="nom">Nom Prénom</th>', head2='';
  const cols=[];
  crits.forEach(c=>{
    if(c.sous){
      head1+='<th colspan="'+c.sous.length+'">'+clean(c.label)+' /'+c.max+'</th>';
      c.sous.forEach(sc=>{head2+='<th class="sub">'+sc.label+' /'+sc.max+'</th>';cols.push(sc.max);});
    } else {
      head1+='<th rowspan="2">'+clean(c.label)+' /'+c.max+'</th>';
      cols.push(c.max);
    }
  });
  head1+='<th rowspan="2" class="tot">Total /'+maxTotal(crits)+'</th><th rowspan="2" class="rem">Remarques</th>';
  let rows='';
  const noms=getListeEleves(cl);
  for(let i=1;i<=25;i++){
    rows+='<tr><td class="nom"><span class="idx">'+i+'</span> '+esc(noms[i-1]||'')+'</td>';
    cols.forEach(m=>{rows+='<td class="sc">'+nums(m)+'</td>';});
    rows+='<td class="tot"></td><td></td></tr>';
  }
  // Rappel des barèmes (2e page)
  let rappel='';
  crits.forEach(c=>{
    rappel+='<div class="rc"><b>'+clean(c.label)+' — /'+c.max+'</b> <i>'+c.hint+'</i><table>';
    c.table.forEach(r=>{rappel+='<tr><td>'+r[0]+'</td><td class="p">'+r[1]+'</td></tr>';});
    rappel+='</table></div>';
  });
  const html='<html><head><meta charset="UTF-8"><title>Fiche '+sport.nom+' '+cycLabel+'</title><style>'
   +'@page{size:A4 landscape;margin:8mm}body{font-family:Arial,sans-serif;margin:0;color:#111}'
   +'h2{margin:0 0 4px;font-size:14px;color:#0e7c7b}.meta{font-size:11px;margin-bottom:6px}.meta span{display:inline-block;border-bottom:1px solid #333;min-width:90px;margin:0 10px 0 3px}'
   +'table.g{width:100%;border-collapse:collapse;table-layout:fixed}'
   +'.g th{background:#0e7c7b;color:#fff;font-size:8px;padding:2px;border:1px solid #fff}.g th.sub{background:#3a9d9c;font-weight:normal}'
   +'.g td{border:1px solid #888;height:5.6mm;padding:0;font-size:8px}.g td.sc{text-align:center;white-space:nowrap}'
   +'.n{display:inline-block;width:3.6mm;height:3.6mm;line-height:3.6mm;border:.5px solid #aaa;border-radius:50%;margin:0 .3px;font-size:7px;text-align:center}'
   +'.g .nom{width:34mm;text-align:left}.g .tot{width:10mm}.g .rem{width:26mm}.idx{color:#999;font-size:7px;padding-left:2px}'
   +'.rap{page-break-before:always}.rc{margin-bottom:8px;font-size:10px;break-inside:avoid}.rc i{color:#555}'
   +'.rc table{border-collapse:collapse;margin-top:2px}.rc td{border:1px solid #bbb;padding:2px 6px}.rc td.p{text-align:center;font-weight:700;width:40px}'
   +'</style></head><body>'
   +'<h2>'+sport.emoji+' '+sport.nom+' — '+cycLabel+'</h2>'
   +'<div class="meta">Classe <span>'+(cl||'')+'</span> Date <span></span> Groupe / terrain <span></span> Match <span></span></div>'
   +'<table class="g"><tr>'+head1+'</tr>'+(head2?'<tr>'+head2+'</tr>':'')+rows+'</table>'
   +'<div class="rap"><h2>Rappel du barème — '+sport.nom+' '+cycLabel+'</h2>'+rappel+'</div>'
   +'</body></html>';
  const w=window.open('','_blank');
  w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
}

var coParams = { c3:{ duree:30, balises:30 }, c4:{ duree:40, balises:30 } };

function coAdj(cyc, param, delta) {
  var mn = 10, mx = param==='duree' ? 60 : 50;
  coParams[cyc][param] = Math.max(mn, Math.min(mx, coParams[cyc][param]+delta));
  var el = document.getElementById('co-'+param+'-'+cyc);
  if(el) el.textContent = coParams[cyc][param];
  coUpdateBareme(cyc);
}

function coUpdateBareme(cyc) {
  var el = document.getElementById('co-bareme-'+cyc);
  if(!el) return;
  var nb = coParams[cyc].balises;
  var duree = coParams[cyc].duree;
  // 5e : seuils plus accessibles ; 4e et 3e : 90 / 70 / 50 / 30 %.
  var q = (cyc==='c4' && classeCycle('c4')==='5e') ? [0.8,0.6,0.4,0.2] : [0.9,0.7,0.5,0.3];
  var thresholds = [
    { pts:'7 pts',   min: Math.round(nb*q[0]) },
    { pts:'5-6 pts', min: Math.round(nb*q[1]) },
    { pts:'3-4 pts', min: Math.round(nb*q[2]) },
    { pts:'2 pts',   min: Math.round(nb*q[3]) },
    { pts:'1 pt',    min: 1 }
  ];
  var html = '';
  for(var i=0;i<thresholds.length;i++){
    var t = thresholds[i];
    var maxB = i===0 ? nb : thresholds[i-1].min-1;
    var range = i===0 ? ('≥'+t.min) : (t.min===1 ? '1–'+maxB : t.min+'–'+maxB);
    html += '<span style="display:inline-block;margin-right:10px;white-space:nowrap"><b style="color:var(--teal)">'+t.pts+'</b> : '+range+' bal.</span>';
  }
  html += '<div style="margin-top:5px;font-size:.7rem;color:var(--muted)">'+duree+' min · '+nb+' balises posées</div>';
  el.innerHTML = html;
}

// Import de notes via #import=<base64url(JSON)> : {sport, cl, eleves:[{prenom, scores}]} — fusionné sans doublons.
(function(){
  var m=location.hash.match(/import=([\w-]+)/); if(!m) return;
  try{
    var b64=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(b64.length%4) b64+='=';
    var d=JSON.parse(decodeURIComponent(escape(atob(b64))));
    var sp=SPORTS.find(function(x){return x.id===d.sport;}); if(!sp) return;
    var cyc = d.cl==='6e' ? 'c3' : 'c4';
    var arr = cyc==='c3' ? state[sp.id].c3.eleves : (elevesCl[d.cl][sp.id] || (elevesCl[d.cl][sp.id]=[]));
    var n=0;
    d.eleves.forEach(function(e){
      if(arr.some(function(x){return x.prenom===e.prenom;})) return;
      arr.push({prenom:e.prenom, scores:e.scores, total:computeTotal(sp[cyc].criteres,e.scores), max:maxTotal(sp[cyc].criteres)});
      n++;
    });
    saveNotes();
    history.replaceState(null,'',location.pathname+'#sport='+d.sport+'&cl='+d.cl);
    setTimeout(function(){ showToast(n+' élèves importés ✓'); },400);
  }catch(e){}
})();
SPORTS.forEach(function(sp){ renderListe(sp.id,'c3'); });
majTerrains();
majNav();
buildHome();
remplirNoms();
(function(){
  var m=location.hash.match(/sport=([\w-]+)(?:&cl=(\w+))?/);
  if(m) ouvrirBareme(m[1], m[2]||'6e');
})();
</script>
